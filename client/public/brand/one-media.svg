<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="One Media">
  <!-- شعار ون مديا: دائرة داكنة بإطار برتقالي، مثلث تشغيل، واسم العلامة. -->
  <rect width="1000" height="1000" fill="#333333"/>
  <circle cx="500" cy="500" r="440" fill="none" stroke="#f47b20" stroke-width="12"/>

  <!-- حرف O على هيئة حلقة، وداخلها فجوة يدخلها مثلث التشغيل من اليسار. -->
  <path fill="#ffffff" d="M348 345c-96 0-174 78-174 174s78 174 174 174 174-78 174-174-78-174-174-174zm0 92c45 0 82 37 82 82s-37 82-82 82-82-37-82-82 37-82 82-82z"/>
  <!-- مثلث التشغيل البرتقالي. -->
  <path fill="#f47b20" d="M155 398l186 121-186 121z"/>

  <!-- كلمة media بالبرتقالي أعلى اليمين. -->
  <text x="492" y="432" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="108" font-weight="600" fill="#f47b20" letter-spacing="2">media</text>
  <!-- بقية كلمة One بالأبيض. -->
  <text x="470" y="632" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="210" font-weight="700" fill="#ffffff" letter-spacing="-4">ne</text>
</svg>
